[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-edocs"
version = "0.1.0"
description = "Electronic document generation, Word (.docx) template engine, dynamic tables, PDF conversion, QR verification and E-IMZO signing workflow for Django."
readme = "README.md"
authors = [
    { name = "django-edocs contributors" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = [
    "django",
    "edocs",
    "e-imzo",
    "document-generation",
    "docx-template",
    "pdf",
    "qr-code",
    "digital-signature",
    "workflow",
    "uzbekistan"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.12",
    "python-docx>=1.1.0",
    "docxtpl>=0.17.0",
    "jinja2>=3.0.0",
    "requests>=2.28.0",
    "qrcode>=7.0",
    "pillow>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/Sniperat/django-edocs"
Repository = "https://github.com/Sniperat/django-edocs.git"
Documentation = "https://github.com/Sniperat/django-edocs#readme"
"Bug Tracker" = "https://github.com/Sniperat/django-edocs/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["edocs*"]

[tool.setuptools.package-data]
"*" = ["templates/**/*", "static/**/*"]
